---
version: 2

project_name: manifest-ledger

release:
  github:
    owner: manifest-network
    name: manifest-ledger

builds:
  - id: manifest-ledger
    main: ./cmd/manifestd
    binary: manifestd
    mod_timestamp: "{{ .CommitTimestamp }}"
    tags:
      - netgo
      - muslc
      - ledger
    flags:
      - -trimpath
      - -mod=readonly
    ldflags:
      - -s -w -linkmode=external -extldflags "-Wl,-z,muldefs -static" -X github.com/cosmos/cosmos-sdk/version.Name=manifest -X github.com/cosmos/cosmos-sdk/version.AppName=manifestd -X github.com/cosmos/cosmos-sdk/version.Version=v{{ .Version }} -X github.com/cosmos/cosmos-sdk/version.Commit={{ .Commit }} -X github.com/cosmos/cosmos-sdk/version.BuildTags=netgo,muslc,ledger -X github.com/manifest-network/manifest-ledger/app.Bech32Prefix=manifest
    env:
      - CGO_ENABLED=1
      - CC=gcc
    hooks:
      post:
        - cmd: ./scripts/verify-release-binary.sh "{{ .Path }}"
          output: true
    goos:
      - linux
#      - darwin
    goarch:
      - amd64
#      - arm64

archives:
  - formats:
      - tar.gz
    name_template: "{{ .ProjectName }}-v{{ .Version }}-{{ .Os }}-{{ .Arch }}{{ if .Arm }}v{{ .Arm }}{{ end }}"

sboms:
  - id: archive
    artifacts: archive
    disable: false

snapshot:
  version_template: '{{ .Version }}-SNAPSHOT-{{ .ShortCommit }}'

checksum:
  name_template: '{{ .ProjectName }}_{{ .Version }}_checksums.txt'
  algorithm: sha256

git:
  tag_sort: -version:refname

github_urls:
  download: https://github.com/manifest-network/manifest-ledger/releases
