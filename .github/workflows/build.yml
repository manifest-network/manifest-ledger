name: Build Manifest

on:
  push:
    branches:
      - main
      - release/**
  pull_request:
    branches:
      - main
      - release/**
    types: [opened, reopened, synchronize]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  protobuf:
    name: protobuf
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Compile, lint and verify generated protobuf sources
        run: make proto-check

  goreleaser-snapshot:
    name: goreleaser snapshot
    # Match release-bin.yaml: newer glibc headers raise the binary's runtime floor.
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - name: Build snapshot archives
        uses: goreleaser/goreleaser-action@ec59f474b9834571250b370d4735c50f8e2d1e29 # v7.0.0
        with:
          version: v2.16.0
          args: release --snapshot --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - run: make lint

  build:
    runs-on: ${{ matrix.runner }}
    env:
      GOOS: ${{ matrix.targetos }}
      GOARCH: ${{ matrix.arch }}
    strategy:
      matrix:
        include:
          - arch: amd64
            targetos: linux
            runner: ubuntu-latest
          - arch: amd64
            targetos: darwin
            runner: macos-15-intel

    name: build ${{ matrix.arch }} for ${{ matrix.targetos }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          check-latest: true
      - name: Compile binary
        run: |
          go mod download
          make build

  tidy:
    runs-on: ubuntu-latest
    name: tidy
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - name: Check root module is tidy
        run: GOWORK=off go mod tidy -diff
      - name: Check interchaintest module is tidy
        working-directory: interchaintest
        run: GOWORK=off go mod tidy -diff
