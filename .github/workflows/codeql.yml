name: "CodeQL"

on:
  workflow_call:
  push:
    branches:
      - main
      - release/**
  pull_request:
    branches:
      - main
      - release/**
    types: [opened, reopened, synchronize]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: 1.26.7

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # CodeQL's external-repository resolver treats the revision as a branch or tag,
      # so check out the immutable commit first and pass it to CodeQL as a local pack.
      - name: Checkout pinned Cosmos SDK CodeQL queries
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: crypto-com/cosmos-sdk-codeql
          ref: 95e3707788fe2b95c84b7bc8e5694977fdc95611
          path: .codeql/cosmos-sdk-codeql
          persist-credentials: false
          sparse-checkout: |
            codeql-pack.lock.yml
            qlpack.yml
            src
          sparse-checkout-cone-mode: false
      - name: Verify Cosmos SDK CodeQL query pin
        run: test "$(git -C .codeql/cosmos-sdk-codeql rev-parse HEAD)" = "95e3707788fe2b95c84b7bc8e5694977fdc95611"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      # Initializes the CodeQL tools for scanning.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: "go"
          queries: ./.codeql/cosmos-sdk-codeql,security-and-quality
      # Autobuild attempts to build any compiled languages  (C/C++, C#, or Java).

      # If this step fails, then you should remove it and run the build manually (see below)
      # - name: Autobuild
      #   uses: github/codeql-action/autobuild@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
      #   with:
      #     debug: true
      # ℹ️ Command-line programs to run using the OS shell.
      # 📚 https://git.io/JvXDl
      # ✏️ If the Autobuild fails above, remove it and uncomment the following three lines
      #    and modify them (or add more) to build your code if your project
      #    uses a compiled language
      - name: Build
        run: make build

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
