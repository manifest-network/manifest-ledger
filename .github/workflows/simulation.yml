name: Simulation Tests

on:
  workflow_call:
  push:
    branches:
      - main
      - release/**
  pull_request:
    branches:
      - main
      - release/**
    types: [opened, reopened, synchronize]

permissions:
  contents: read

env:
  GO_VERSION: 1.26.7

concurrency:
  group: simulation-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Full application simulation (fixed seed)
        run: make sim-full-app
      - name: Simulation after state import (fixed seed)
        run: make sim-after-import
      - name: Simulation export/import equivalence (fixed seed)
        run: make sim-import-export
      - name: Simulate application state determinism (fixed seed)
        run: make sim-app-determinism
