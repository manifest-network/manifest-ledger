name: E2E

on:
  push:
    branches:
      - main
      - release/**
    tags:
      - "**"
  pull_request:
    branches:
      - main
      - release/**
    types: [opened, reopened, synchronize]

permissions:
  contents: read
  packages: write

env:
  GO_VERSION: 1.25.9
  TAR_PATH: /tmp/manifest-docker-image.tar
  IMAGE_NAME: manifest-docker-image
  UPGRADE_TAR_PATH: /tmp/manifest-testnet-upgrade-image.tar
  UPGRADE_IMAGE_NAME: manifest-testnet-upgrade-image

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Go ${{ env.GO_VERSION }}
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build and export
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          tags: manifest:local
          outputs: type=docker,dest=${{ env.TAR_PATH }}
          build-args: |
            BUILD_CMD=build-coverage

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ env.IMAGE_NAME }}
          path: ${{ env.TAR_PATH }}

      - name: Build and export test-only upgrade image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          tags: manifest-testnet-upgrade:local
          outputs: type=docker,dest=${{ env.UPGRADE_TAR_PATH }}
          build-args: |
            BUILD_CMD=build-coverage
            BUILD_TAGS=muslc testnet_upgrade_fixture
            VERSION=eng879-test-upgrade

      - name: Upload test-only upgrade image
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ env.UPGRADE_IMAGE_NAME }}
          path: ${{ env.UPGRADE_TAR_PATH }}

  e2e-tests:
    needs: build-docker
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # names of `make` commands to run tests
        test:
          - "ictest-ibc"
          - "ictest-poa"
          - "ictest-poa-unjail-dup"
          - "ictest-tokenfactory"
          - "ictest-manifest"
          - "ictest-group-poa"
          - "ictest-group"
          - "ictest-cosmwasm"
          - "ictest-chain-upgrade"
          - "ictest-in-place-testnet"
          - "ictest-sku"
          - "ictest-billing"
          - "ictest-billing-extra"
          - "ictest-billing-upgrade"
      fail-fast: false

    steps:
      - name: Set up Go ${{ env.GO_VERSION }}
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: checkout chain
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download Tarball Artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ env.IMAGE_NAME }}
          path: /tmp

      - name: Load Docker Image
        run: |
          docker image load -i ${{ env.TAR_PATH }}
          docker image ls -a

      - name: Download test-only upgrade image
        if: matrix.test == 'ictest-in-place-testnet'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ env.UPGRADE_IMAGE_NAME }}
          path: /tmp

      - name: Load test-only upgrade image
        if: matrix.test == 'ictest-in-place-testnet'
        run: docker image load -i ${{ env.UPGRADE_TAR_PATH }}

      - name: Run Test
        run: make ${{ matrix.test }}
