name: E2E

on:
  workflow_call:
  push:
    branches:
      - main
      - release/**
  pull_request:
    branches:
      - main
      - release/**
    types: [opened, reopened, synchronize]

permissions:
  contents: read

env:
  GO_VERSION: 1.26.7
  TAR_PATH: /tmp/manifest-docker-image.tar
  IMAGE_NAME: manifest-docker-image
  E2E_IMAGE_VERSION: e2e-${{ github.sha }}

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-docker:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install checksum-verified Buildx
        run: |
          docker_config="$RUNNER_TEMP/docker-config"
          mkdir -p "$docker_config/cli-plugins"
          sh ./scripts/install-buildx.sh "$docker_config/cli-plugins"
          DOCKER_CONFIG="$docker_config" docker buildx version | grep --fixed-strings ' v0.36.1 '
          chmod 0555 "$docker_config/cli-plugins/docker-buildx" "$docker_config/cli-plugins"
          printf '%s\n' "DOCKER_CONFIG=$docker_config" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        with:
          driver-opts: |
            image=docker.io/moby/buildkit:v0.32.2@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8

      - name: Build and export
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          tags: manifest:local
          outputs: type=docker,dest=${{ env.TAR_PATH }}
          build-args: |
            BUILD_CMD=build
            COMMIT=${{ github.sha }}
            VERSION=${{ env.E2E_IMAGE_VERSION }}

      - name: Install checksum-verified Trivy
        env:
          TRIVY_INSTALL_DIR: ${{ runner.temp }}/trivy-bin
        run: |
          mkdir -p "$TRIVY_INSTALL_DIR"
          sh ./scripts/install-trivy.sh "$TRIVY_INSTALL_DIR"
          echo "$TRIVY_INSTALL_DIR" >> "$GITHUB_PATH"

      - name: Scan shipped linux/amd64 OS packages
        env:
          TRIVY_CACHE_DIR: ${{ runner.temp }}/trivy-cache
        run: |
          trivy image \
            --input "$TAR_PATH" \
            --scanners vuln \
            --pkg-types os \
            --severity HIGH,CRITICAL \
            --ignore-unfixed=false \
            --exit-code 1 \
            --timeout 10m0s \
            --disable-telemetry \
            --skip-version-check \
            --no-progress

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.IMAGE_NAME }}
          path: ${{ env.TAR_PATH }}

  build-docker-arm64:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go ${{ env.GO_VERSION }}
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install checksum-verified Buildx
        run: |
          docker_config="$RUNNER_TEMP/docker-config"
          mkdir -p "$docker_config/cli-plugins"
          sh ./scripts/install-buildx.sh "$docker_config/cli-plugins"
          DOCKER_CONFIG="$docker_config" docker buildx version | grep --fixed-strings ' v0.36.1 '
          chmod 0555 "$docker_config/cli-plugins/docker-buildx" "$docker_config/cli-plugins"
          printf '%s\n' "DOCKER_CONFIG=$docker_config" >> "$GITHUB_ENV"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          image: docker.io/tonistiigi/binfmt:qemu-v10.2.3-68@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        with:
          driver-opts: |
            image=docker.io/moby/buildkit:v0.32.2@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8

      - name: Validate linux/arm64 image build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/arm64
          outputs: type=local,dest=${{ runner.temp }}/manifest-arm64-rootfs
          build-args: |
            BUILD_CMD=build
            COMMIT=${{ github.sha }}
            VERSION=${{ env.E2E_IMAGE_VERSION }}

      - name: Scan the shipped linux/arm64 binary
        run: |
          make govulncheck-install
          go run ./tools/govulncheck-policy \
            -govulncheck "$(go env GOPATH)/bin/govulncheck" \
            -- -mode=binary "${{ runner.temp }}/manifest-arm64-rootfs/usr/bin/manifestd"

      - name: Install checksum-verified Trivy
        env:
          TRIVY_INSTALL_DIR: ${{ runner.temp }}/trivy-bin
        run: |
          mkdir -p "$TRIVY_INSTALL_DIR"
          sh ./scripts/install-trivy.sh "$TRIVY_INSTALL_DIR"
          echo "$TRIVY_INSTALL_DIR" >> "$GITHUB_PATH"

      - name: Scan shipped linux/arm64 OS packages
        env:
          TRIVY_CACHE_DIR: ${{ runner.temp }}/trivy-cache
        run: |
          trivy rootfs \
            --scanners vuln \
            --pkg-types os \
            --severity HIGH,CRITICAL \
            --ignore-unfixed=false \
            --exit-code 1 \
            --timeout 10m0s \
            --disable-telemetry \
            --skip-version-check \
            --no-progress \
            "${{ runner.temp }}/manifest-arm64-rootfs"

  e2e-tests:
    needs: build-docker
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        # names of `make` commands to run tests
        test:
          - "ictest-ibc"
          - "ictest-poa"
          - "ictest-poa-unjail-dup"
          - "ictest-tokenfactory"
          - "ictest-manifest"
          - "ictest-group-poa"
          - "ictest-group"
          - "ictest-cosmwasm"
          - "ictest-chain-upgrade"
          - "ictest-sku"
          - "ictest-billing-lease"
          - "ictest-billing-credit"
          - "ictest-billing-advanced"
          - "ictest-billing-state"
          - "ictest-billing-reservation"
          - "ictest-billing-extra"
          - "ictest-billing-upgrade"
      fail-fast: false

    steps:
      - name: checkout chain
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go ${{ env.GO_VERSION }}
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            go.sum
            interchaintest/go.sum

      - name: Download Tarball Artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ env.IMAGE_NAME }}
          path: /tmp

      - name: Load Docker Image
        run: |
          docker image load -i ${{ env.TAR_PATH }}
          docker image ls -a

      - name: Run Test
        run: make ${{ matrix.test }}
